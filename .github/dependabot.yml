version: 2
updates:
  - package-ecosystem: npm
    directory: /mistral-support
    # Keep the minimums in package.json; only refresh the tested lockfile.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      mistral-support:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
